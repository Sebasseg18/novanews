 text-anchor="start" x="60" y="580">Los interesados podrán postularse a través de la plataforma oficial hasta</text><text fill="#212529" style="font-family:Helvetica, Arial, sans-serif; font-size:11.5px; font-weight:normal;" text-anchor="start" x="60" y="602">el próximo mes, cumpliendo con los requisitos académicos establecidos.</text></g><g id="acciones"><rect fill="#E63946" height="40" rx="8" ry="8" width="170" x="60" y="640" /><text fill="#FFFFFF" style="font-family:Helvetica, Arial, sans-serif; font-size:11px; font-weight:bold;" text-anchor="middle" x="145" y="665">♥  Agregar a favoritos</text><rect fill="none" height="40" rx="8" ry="8" stroke="#DEE2E6" stroke-width="1" width="154" x="246" y="640" /><text fill="#212529" style="font-family:Helvetica, Arial, sans-serif; font-size:11px; font-weight:bold;" text-anchor="middle" x="323" y="665">Contactar</text></g><g id="relacionadas"><text fill="#212529" style="font-family:Helvetica, Arial, sans-serif; font-size:14px; font-weight:bold;" text-anchor="start" x="60" y="714">Noticias relacionadas</text><g id="relacionada_1"><rect fill="#FFFFFF" height="170" rx="10" ry="10" stroke="#DEE2E6" stroke-width="1" width="300" x="60" y="744" /><g><rect fill="#CED6DE" height="81" width="300" x="60" y="744" /><circle cx="198.417" cy="769.59" fill="#FFFFFF" r="8.91" /><polygon fill="#B4BDC6" points="70,811 165.0,772.35 225.0,785 270.0,784.5 350,811" /></g><rect fill="#F2A900" height="19.5" rx="9.75" ry="9.75" width="67.59" x="72" y="801" /><text fill="#FFFFFF" style="font-family:Helvetica, Arial, sans-serif; font-size:9.5px; font-weight:bold;" text-anchor="start" x="81" y="813.41">Educación</text><text fill="#212529" style="font-family:Helvetica, Arial, sans-serif; font-size:12.5px; font-weight:bold;" text-anchor="start" x="74" y="853">Universidades adoptan aulas híbridas</text><text fill="#6E7882" style="font-family:Helvetica, Arial, sans-serif; font-size:10px; font-weight:normal;" text-anchor="start" x="74" y="875">Breve descripci