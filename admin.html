<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar noticias | NovaNews</title>
  <meta name="description" content="Crear y eliminar noticias de NovaNews (mini CRUD).">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>
  <header id="header"></header>

  <main id="principal">

    <section class="seccion">
      <div class="contenedor">
        <h1 class="seccion__titulo">Administrar noticias</h1>
        <p class="seccion__sub">Crea nuevas publicaciones o elimina las existentes. Cambios guardados en tu navegador.</p>

        <div id="mensaje-admin" class="alerta alerta--exito" role="status" hidden></div>

        <div class="admin-grid">
          <div class="panel">
            <h2>Nueva noticia</h2>
            <form id="form-noticia" class="formulario" novalidate>
              <div class="campo">
                <label for="titulo">Título *</label>
                <input type="text" id="titulo" name="titulo" maxlength="90">
                <span class="campo__error" id="error-titulo"></span>
              </div>
              <div class="fila">
                <div class="campo">
                  <label for="categoria">Categoría *</label>
                  <select id="categoria" name="categoria"></select>
                  <span class="campo__error" id="error-categoria"></span>
                </div>
                <div class="campo">
                  <label for="autor">Autor</label>
                  <input type="text" id="autor" name="autor" placeholder="Redacción NovaNews">
                  <span class="campo__error"></span>
                </div>
              </div>
              <div class="campo">
                <label for="resumen">Resumen *</label>
                <textarea id="resumen" name="resumen" maxlength="180" style="min-height:80px"></textarea>
                <span class="campo__error" id="error-resumen"></span>
              </div>
              <div class="campo">
                <label for="contenido">Contenido * (separa los párrafos con una línea en blanco)</label>
                <textarea id="contenido" name="contenido"></textarea>
                <span class="campo__error" id="error-contenido"></span>
              </div>
              <div><button type="submit" class="btn btn-primario">Publicar noticia</button></div>
            </form>
          </div>

          <div class="panel">
            <h2>Noticias publicadas (<span id="total">0</span>)</h2>
            <div class="acciones-tabla">
              <button type="button" class="btn btn-secundario btn-pequeno" id="btn-restablecer">Restablecer datos originales</button>
            </div>
            <div class="tabla-scroll">
              <table>
                <thead><tr><th>Título</th><th>Categoría</th><th>Fecha</th><th><span class="solo-lectores">Acciones</span></th></tr></thead>
                <tbody id="tabla-noticias"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
